<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Pasos en Tiempo Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .circle-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 12;
    }

    .circle-progress {
      fill: none;
      stroke: url(#gradient);
      stroke-width: 12;
      stroke-dasharray: 502;
      stroke-dashoffset: 502;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }

    .glow {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl glow relative overflow-hidden">
    
    <!-- Encabezado -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
          <i class="fa-solid fa-shoe-prints text-emerald-400"></i> StepTracker
        </h1>
        <p class="text-xs text-slate-400 mt-1" id="statusText">Listo para empezar</p>
      </div>
      <button id="permissionBtn" class="bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 px-3 py-1.5 rounded-full text-xs font-semibold transition border border-emerald-500/30">
        Activar Sensor
      </button>
    </div>

    <!-- Indicador de Progreso Circular -->
    <div class="relative flex items-center justify-center my-6">
      <svg class="w-64 h-64 transform -rotate-90">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
        <circle cx="128" cy="128" r="80" class="circle-bg"></circle>
        <circle id="progressCircle" cx="128" cy="128" r="80" class="circle-progress"></circle>
      </svg>

      <!-- Contador Central -->
      <div class="absolute flex flex-col items-center justify-center text-center">
        <span id="stepCount" class="text-5xl font-black text-white tracking-tight">0</span>
        <span class="text-xs uppercase tracking-widest text-slate-400 font-bold mt-1">Pasos</span>
        <div class="mt-2 text-xs text-emerald-400 font-semibold bg-emerald-950/60 px-3 py-0.5 rounded-full border border-emerald-800/40">
          Meta: <span id="goalText">10,000</span>
        </div>
      </div>
    </div>

    <!-- Métricas Adicionales -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-2xl text-center">
        <i class="fa-solid fa-fire text-orange-400 text-lg mb-1"></i>
        <div id="caloriesCount" class="text-lg font-bold text-slate-100">0</div>
        <div class="text-[10px] uppercase font-bold text-slate-400">Kcal</div>
      </div>

      <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-2xl text-center">
        <i class="fa-solid fa-route text-cyan-400 text-lg mb-1"></i>
        <div id="distanceCount" class="text-lg font-bold text-slate-100">0.00</div>
        <div class="text-[10px] uppercase font-bold text-slate-400">Km</div>
      </div>

      <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-2xl text-center">
        <i class="fa-solid fa-stopwatch text-purple-400 text-lg mb-1"></i>
        <div id="timerText" class="text-lg font-bold text-slate-100">00:00</div>
        <div class="text-[10px] uppercase font-bold text-slate-400">Tiempo</div>
      </div>
    </div>

    <!-- Botones de Control Principal -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <button id="toggleBtn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-play" id="toggleIcon"></i>
        <span id="toggleText">Iniciar</span>
      </button>

      <button id="resetBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate-left"></i>
        <span>Reiniciar</span>
      </button>
    </div>

    <!-- Modo Simulación para Pruebas en Laptop/Escritorio -->
    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
      <span class="text-xs text-slate-400 font-medium">Simular pasos (para PC)</span>
      <button id="simStepBtn" class="bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
        +1 Paso manual
      </button>
    </div>

  </div>

  <script>
    // Variables de Estado
    let steps = 0;
    let goal = 10000;
    let isActive = false;
    let secondsActive = 0;
    let timerInterval = null;

    // Configuración del Algoritmo de Detección de Pasos
    let lastAccel = 0;
    const threshold = 11.5; // Umbral de aceleración m/s²
    let lastStepTime = 0;
    const stepCooldown = 330; // Cooldown mínimo entre pasos (ms)

    // Referencias al DOM
    const stepCountEl = document.getElementById('stepCount');
    const caloriesCountEl = document.getElementById('caloriesCount');
    const distanceCountEl = document.getElementById('distanceCount');
    const timerTextEl = document.getElementById('timerText');
    const progressCircle = document.getElementById('progressCircle');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleText = document.getElementById('toggleText');
    const toggleIcon = document.getElementById('toggleIcon');
    const resetBtn = document.getElementById('resetBtn');
    const permissionBtn = document.getElementById('permissionBtn');
    const simStepBtn = document.getElementById('simStepBtn');
    const statusText = document.getElementById('statusText');

    // Inicialización del círculo de progreso (Circunferencia = 2 * PI * 80 ≈ 502)
    const circumference = 502;

    function updateMetrics() {
      // Cálculo estimado: 1 paso ≈ 0.75m | 1 paso ≈ 0.04 kcal
      const distanceKm = (steps * 0.00075).toFixed(2);
      const calories = Math.round(steps * 0.04);

      stepCountEl.textContent = steps.toLocaleString();
      distanceCountEl.textContent = distanceKm;
      caloriesCountEl.textContent = calories;

      // Actualizar Barra Circular
      const percent = Math.min(steps / goal, 1);
      const offset = circumference - (percent * circumference);
      progressCircle.style.strokeDashoffset = offset;
    }

    function addStep() {
      if (!isActive) return;
      steps++;
      updateMetrics();

      // Retroalimentación Háptica (si está disponible en móvil)
      if (navigator.vibrate) {
        navigator.vibrate(30);
      }
    }

    // Algoritmo para procesar datos del Acelerómetro
    function handleMotion(event) {
      if (!isActive) return;

      const accel = event.accelerationIncludingGravity;
      if (!accel) return;

      // Magnitud del vector de aceleración en 3D
      const magnitude = Math.sqrt(accel.x * accel.x + accel.y * accel.y + accel.z * accel.z);
      const now = Date.now();

      // Detección de pico
      if (magnitude > threshold && (now - lastStepTime) > stepCooldown) {
        addStep();
        lastStepTime = now;
      }
      lastAccel = magnitude;
    }

    // Solicitar permisos del sensor (Requerido en iOS 13+)
    async function requestSensorPermission() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const response = await DeviceMotionEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            statusText.textContent = "Sensor conectado y activo";
            permissionBtn.classList.add('hidden');
          } else {
            alert('Permiso de sensores denegado.');
          }
        } catch (e) {
          console.error(e);
        }
      } else if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', handleMotion);
        statusText.textContent = "Sensor conectado";
        permissionBtn.classList.add('hidden');
      } else {
        statusText.textContent = "Sin soporte de hardware (Usa modo simulación)";
      }
    }

    // Cronómetro
    function startTimer() {
      timerInterval = setInterval(() => {
        secondsActive++;
        const mins = String(Math.floor(secondsActive / 60)).padStart(2, '0');
        const secs = String(secondsActive % 60).padStart(2, '0');
        timerTextEl.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // Control Iniciar / Pausar
    toggleBtn.addEventListener('click', () => {
      isActive = !isActive;

      if (isActive) {
        startTimer();
        requestSensorPermission();
        toggleText.textContent = "Pausar";
        toggleIcon.className = "fa-solid fa-pause";
        toggleBtn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20";
        statusText.textContent = "Registrando pasos...";
      } else {
        stopTimer();
        toggleText.textContent = "Continuar";
        toggleIcon.className = "fa-solid fa-play";
        toggleBtn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20";
        statusText.textContent = "En pausa";
      }
    });

    // Resetear Valores
    resetBtn.addEventListener('click', () => {
      if (confirm("¿Deseas reiniciar el contador de pasos?")) {
        isActive = false;
        stopTimer();
        steps = 0;
        secondsActive = 0;
        timerTextEl.textContent = "00:00";
        toggleText.textContent = "Iniciar";
        toggleIcon.className = "fa-solid fa-play";
        toggleBtn.className = "bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20";
        statusText.textContent = "Listo para empezar";
        updateMetrics();
      }
    });

    // Eventos de botones secundarios
    permissionBtn.addEventListener('click', requestSensorPermission);
    simStepBtn.addEventListener('click', () => {
      if (!isActive) {
        toggleBtn.click(); // Iniciar automáticamente si está pausado
      }
      addStep();
    });

    // Inicializar Vista
    updateMetrics();
  </script>
</body>
</html>
